name: CD

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag ancestry
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag commit does not belong to master branch."
            exit 1
          fi

  ci:
    name: Run lint and build
    needs: validate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    needs: ci
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with public URLs
        env:
          VITE_OIDC_AUTHORITY: https://${{ vars.PUBLIC_HOST }}/auth/realms/notes
          VITE_API_URL: https://${{ vars.PUBLIC_HOST }}
        run: npm run build

      - name: Configure SSH access
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload build to the server
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" dist/ "$TARGET:/opt/notas/frontend/"

      - name: Smoke test
        env:
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
        run: |
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' "https://${PUBLIC_HOST}/")"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Frontend responded HTTP $STATUS"
            exit 1
          fi
